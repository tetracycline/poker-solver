[package]
name = "pfdriver"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1"
postflop-solver = { path = "../postflop-solver", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
